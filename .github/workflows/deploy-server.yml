name: Deploy Contexta Server

on:
  push:
    branches: [main]
    paths:
      - "impl/server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: crpi-ui1m3okieeg995dg.cn-shenzhen.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: impl/server
          file: impl/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            crpi-ui1m3okieeg995dg.cn-shenzhen.personal.cr.aliyuncs.com/contexta/contexta:latest-amd64
            crpi-ui1m3okieeg995dg.cn-shenzhen.personal.cr.aliyuncs.com/contexta/contexta:1.0-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ACR 个人版不接受 OCI attestation 的 empty manifest（vnd.oci.empty.v1+json → denied），必须关闭
          provenance: false
          sbom: false

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync compose + pull + restart + health check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_INIT_PASSWORD: ${{ secrets.ADMIN_INIT_PASSWORD }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/known_hosts <<'EOF'
          47.112.20.32 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBdyCiH+SrlGzzm2Y05vMZrrKyaKc0UBWfe0x/ei1V4fMYj0l3FJVP+upDfdAOdDHNub7sYXJxFMB1F7cA7Pj8A=
          47.112.20.32 ssh-rsa 
          47.112.20.32 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxYlvQaxe6RCyzCJF6KsNXupULapPzAjwdi47Nqw39t
          EOF
          # 1) 同步 compose 文件
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes impl/server/docker-compose.yml \
            root@47.112.20.32:/opt/contexta/server/docker-compose.yml
          # 2) 拉取最新镜像并滚动重启；密钥从 Secret 注入（覆盖 .env），为空的项回退 .env（本地直跑方式）
          UP_CMD="docker compose up -d"
          [ -n "$LLM_API_KEY" ] && UP_CMD="LLM_API_KEY='$LLM_API_KEY' $UP_CMD"
          [ -n "$JWT_SECRET" ] && UP_CMD="JWT_SECRET='$JWT_SECRET' $UP_CMD"
          [ -n "$ADMIN_JWT_SECRET" ] && UP_CMD="ADMIN_JWT_SECRET='$ADMIN_JWT_SECRET' $UP_CMD"
          [ -n "$ADMIN_INIT_PASSWORD" ] && UP_CMD="ADMIN_INIT_PASSWORD='$ADMIN_INIT_PASSWORD' $UP_CMD"
          [ -n "$FEISHU_WEBHOOK_URL" ] && UP_CMD="FEISHU_WEBHOOK_URL='$FEISHU_WEBHOOK_URL' $UP_CMD"
          [ -n "$FEISHU_WEBHOOK_SECRET" ] && UP_CMD="FEISHU_WEBHOOK_SECRET='$FEISHU_WEBHOOK_SECRET' $UP_CMD"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@47.112.20.32 \
            "cd /opt/contexta/server && docker compose pull && $UP_CMD"
          # 3) 健康检查：30 次 × 2s 重试（宿主 443 → 容器 8080）
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@47.112.20.32 \
            'set -e; for i in $(seq 1 30); do
               if curl -fsS http://127.0.0.1:443/api/health >/dev/null 2>&1; then
                 echo "[deploy] health check OK"; exit 0
               fi
               sleep 2
             done
             echo "[deploy] health check FAILED"; exit 1'
