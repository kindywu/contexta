name: Deploy Contexta Server

on:
  push:
    branches: [main]
    paths:
      - "impl/server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: impl/server
          file: impl/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/contexta-server:latest
            ghcr.io/${{ github.repository_owner }}/contexta-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync compose + pull + restart + health check
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/known_hosts <<'EOF'
          47.112.20.32 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBdyCiH+SrlGzzm2Y05vMZrrKyaKc0UBWfe0x/ei1V4fMYj0l3FJVP+upDfdAOdDHNub7sYXJxFMB1F7cA7Pj8A=
          47.112.20.32 ssh-rsa 
          47.112.20.32 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxYlvQaxe6RCyzCJF6KsNXupULapPzAjwdi47Nqw39t
          EOF
          # 1) 同步 compose 文件
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes impl/server/docker-compose.yml \
            root@47.112.20.32:/opt/contexta/server/docker-compose.yml
          # 2) 拉取最新镜像并滚动重启；LLM_API_KEY 从 Secret 注入（覆盖 .env），为空则回退 .env（本地直跑方式）
          if [ -n "$LLM_API_KEY" ]; then
            UP_CMD="LLM_API_KEY='$LLM_API_KEY' docker compose up -d"
          else
            UP_CMD="docker compose up -d"
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@47.112.20.32 \
            "cd /opt/contexta/server && docker compose pull && $UP_CMD"
          # 3) 健康检查：30 次 × 2s 重试（宿主 443 → 容器 8080）
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@47.112.20.32 \
            'set -e; for i in $(seq 1 30); do
               if curl -fsS http://127.0.0.1:443/api/health >/dev/null 2>&1; then
                 echo "[deploy] health check OK"; exit 0
               fi
               sleep 2
             done
             echo "[deploy] health check FAILED"; exit 1'
