services:
  contexta-server:
    image: ghcr.io/kindywu/contexta-server:latest
    container_name: contexta-server
    restart: unless-stopped
    ports:
      - "443:8080" # 宿主 443（安全组放行）→ 容器 8080（应用监听端口不变）
    env_file:
      - ./.env
    environment:
      # 密钥注入：GHA deploy 从 Secret 传入（覆盖 .env）；本地直跑时 .env 兜底
      - LLM_API_KEY=${LLM_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
