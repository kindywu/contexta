name: contexta
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.5
  go_router: ^17.4.0
  kittentts: ^0.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.2
  wakelock_plus: ^1.7.0
  workmanager: ^0.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  test: ^1.31.0
  # 测试直连 SQLite 读基线（打开 drift 前的原始状态快照）；生产代码不用
  sqlite3: ^3.5.1
  # 计时器单测：虚拟时钟推进 15s/120s tick（计时器逻辑不依赖真实时间）
  fake_async: ^1.3.1
  wakelock_plus_platform_interface: ^1.6.0

# drift_dev 2.34.0 的代码使用 sqlparser 的 DartPlaceholder.when（^0.44.0 约束内
# 的最后版本 0.44.5 有该方法）；意外作为补丁发布的 0.44.6（实为 0.45.0 代码，
# 改 sealed class 并移除 when）会让 build_runner 编译失败。新 drift_dev（≥2.34.1）
# 要求 analyzer ^13，与当前 Flutter SDK 的 flutter_test/test 链（analyzer <13）
# 冲突。故固定 sqlparser 0.44.5。
dependency_overrides:
  sqlparser: 0.44.5

flutter:
  uses-material-design: true
  assets:
    - assets/contexta.db
    - assets/seed_articles.json
    - assets/kittentts_models/
